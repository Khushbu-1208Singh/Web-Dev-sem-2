<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let pro = new Promise((resolve,reject)=>){
            let proposal="false"
            if(proposal==="true"){
                resolve()
            }
            else{
                reject()
            }
        })
        pro.then(()=>console.log("proposal accepted"))
        .catch(()=>console.log("proposal rejected"))
    </script>
</body>
</html>
